<!DOCTYPE html>
<html>

<head>
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card p-4 mx-auto shadow" style="max-width:400px;">

            <h4 class="text-center mb-4">Create Account</h4>

            <form method="POST">

                <input type="text" name="name" class="form-control mb-3" placeholder="Full Name" required>

                <input type="email" name="email" class="form-control mb-3" placeholder="Email" required>

                <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>

                <input type="password" name="confirm" class="form-control mb-3" placeholder="Confirm Password" required>

                <!-- ROLE -->
                <label class="mb-1">Select Role</label>
                <select name="role" id="role" class="form-select mb-3" required>
                    <option value="">Select Role</option>
                    <option value="admin">Admin</option>
                    <option value="employee">Employee</option>
                </select>

                <!-- POSITION (ONLY FOR EMPLOYEE) -->
                <div id="positionDiv" style="display:none;">
                    <label class="mb-1">Select Position</label>
                    <select name="position" class="form-select mb-3">
                        <option value="">Select Position</option>
                        <option value="developer">Developer</option>
                        <option value="apm">APM</option>
                    </select>
                </div>

                <button class="btn btn-success w-100">Register</button>

            </form>

        </div>
    </div>

    <script>
        const role = document.getElementById("role");
        const positionDiv = document.getElementById("positionDiv");

        role.addEventListener("change", function () {
            if (this.value === "employee") {
                positionDiv.style.display = "block";
            } else {
                positionDiv.style.display = "none";
            }
        });
    </script>

</body>

</html>
